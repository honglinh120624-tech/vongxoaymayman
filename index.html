<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vòng Quay May Mắn</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.9); } 100% { opacity: 1; transform: scale(1); } }
        .animate-pop-in { animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    </style>
</head>
<body class="min-h-screen bg-slate-50 flex flex-col items-center py-8 px-4 font-sans relative overflow-hidden">

    <div class="w-full max-w-lg mb-8 text-center">
        <h1 class="text-3xl sm:text-5xl font-extrabold text-slate-800 tracking-tight drop-shadow-sm mb-2">Vòng Quay May Mắn</h1>
    </div>
    
    <div class="mb-6 flex items-center justify-between w-full max-w-lg px-4 sm:px-8">
        <div class="bg-white px-4 py-2 rounded-lg shadow-sm border border-slate-100 flex items-center">
            <span class="text-sm font-medium text-slate-500 mr-2">Còn lại:</span>
            <span id="remaining-count" class="text-xl font-bold text-blue-600">60</span>
            <span class="text-sm font-medium text-slate-500 ml-1">số</span>
        </div>
        <button id="reset-btn" class="text-slate-600 hover:text-blue-600 font-medium text-sm border-2 border-slate-200 hover:border-blue-200 bg-white hover:bg-blue-50 px-4 py-2 rounded-lg transition-all flex items-center gap-2 shadow-sm">
            Làm mới
        </button>
    </div>

    <div class="relative w-[90vw] max-w-[450px] aspect-square rounded-full shadow-2xl bg-white border-8 border-white group">
        <div class="absolute top-0 left-1/2 -translate-x-1/2 -mt-4 z-20 filter drop-shadow-md">
            <svg width="40" height="40" viewBox="0 0 40 40" fill="none"><path d="M20 40L0 0H40L20 40Z" fill="#ef4444"/></svg>
        </div>
        
        <div id="wheel-container" class="w-full h-full rounded-full overflow-hidden" style="transition: transform 5000ms cubic-bezier(0.2, 0.8, 0.1, 1);">
            <canvas id="canvas" width="800" height="800" class="w-full h-full origin-center"></canvas>
        </div>
        
        <button id="spin-btn" class="absolute inset-0 m-auto w-20 h-20 sm:w-24 sm:h-24 bg-white rounded-full flex items-center justify-center cursor-pointer shadow-xl z-10 transition-transform hover:scale-105 active:scale-95 border-4 border-slate-50">
            <div class="w-14 h-14 sm:w-16 sm:h-16 bg-slate-800 rounded-full flex items-center justify-center group-hover:bg-blue-600 transition-colors">
                <svg class="w-10 h-10 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" /></svg>
            </div>
        </button>
    </div>

    <!-- Popup Kết Quả -->
    <div id="popup" class="fixed inset-0 flex items-center justify-center z-50 px-4 hidden">
        <div id="popup-overlay" class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm"></div>
        <div class="bg-white rounded-[2rem] p-8 shadow-2xl text-center transform animate-pop-in max-w-sm w-full relative z-10">
            <h2 class="text-3xl font-extrabold text-slate-800 mb-2">Chúc mừng!</h2>
            <div class="bg-slate-50 rounded-2xl py-6 mb-8 border border-slate-100"><span id="winner-number" class="text-7xl font-black text-blue-600">--</span></div>
            <button id="continue-btn" class="w-full py-4 bg-blue-600 text-white font-bold rounded-xl text-lg">Tiếp tục</button>
        </div>
    </div>

    <!-- KHU VỰC NHẠC: Kiểm tra kỹ tên file nhac-vong-quay.mp3 trên github -->
    <audio id="bg-music" loop preload="auto">
        <source src="nhac-vong-quay.mp3" type="audio/mpeg">
    </audio>

    <script>
        const COLORS = ['#fecaca', '#fde047', '#86efac', '#93c5fd', '#c4b5fd', '#fbcfe8', '#fdba74', '#67e8f9'];
        const TOTAL_NUMBERS = 60;
        const SPIN_DURATION = 5000;
        let items = [], rotation = 0, isSpinning = false, selectedItem = null;

        const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d'), wheelContainer = document.getElementById('wheel-container');
        const spinBtn = document.getElementById('spin-btn'), resetBtn = document.getElementById('reset-btn'), popup = document.getElementById('popup');
        const winnerNumber = document.getElementById('winner-number'), continueBtn = document.getElementById('continue-btn');
        const remainingCount = document.getElementById('remaining-count'), bgMusic = document.getElementById('bg-music');

        function initData() { return Array.from({ length: TOTAL_NUMBERS }, (_, i) => ({ id: i + 1, value: i + 1, color: COLORS[i % COLORS.length] })); }

        function updateUI() {
            remainingCount.innerText = items.length;
            spinBtn.disabled = isSpinning || items.length === 0;
        }

        function drawWheel() {
            const size = 800, center = size / 2, radius = size / 2;
            ctx.clearRect(0, 0, size, size);
            if (items.length === 0) return;
            const sliceAngle = (2 * Math.PI) / items.length;
            items.forEach((item, i) => {
                ctx.beginPath(); ctx.moveTo(center, center);
                ctx.arc(center, center, radius, i * sliceAngle, (i + 1) * sliceAngle);
                ctx.fillStyle = item.color; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#ffffff'; ctx.stroke();
                ctx.save(); ctx.translate(center, center); ctx.rotate((i + 0.5) * sliceAngle);
                ctx.textAlign = 'right'; ctx.fillStyle = '#1e293b'; 
                let fontSize = items.length > 40 ? 16 : items.length > 20 ? 24 : 36;
                ctx.font = `bold ${fontSize}px sans-serif`;
                ctx.fillText(item.value.toString(), radius - 30, 0); ctx.restore();
            });
        }

        function spin() {
            if (isSpinning || items.length === 0) return;
            isSpinning = true;

            // Kích hoạt nhạc ngay khi bấm nút Quay
            bgMusic.play().catch(e => console.log("Chờ tương tác để phát nhạc"));

            updateUI();
            const N = items.length, sliceAngle = 360 / N, winnerIdx = Math.floor(Math.random() * N);
            const baseRotation = 270 - (winnerIdx * sliceAngle + sliceAngle / 2);
            const targetRotation = rotation + (360 * 5) + (baseRotation - (rotation % 360));
            rotation = targetRotation;
            wheelContainer.style.transform = `rotate(${rotation}deg)`;

            setTimeout(() => {
                isSpinning = false;
                selectedItem = items[winnerIdx];
                bgMusic.pause(); // Tắt nhạc khi trúng thưởng
                winnerNumber.innerText = selectedItem.value;
                popup.classList.remove('hidden');
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                updateUI();
            }, SPIN_DURATION); 
        }

        function handleContinue() {
            popup.classList.add('hidden');
            bgMusic.play(); // Phát lại nhạc
            if (selectedItem) {
                items = items.filter(item => item.id !== selectedItem.id);
                selectedItem = null;
                drawWheel(); updateUI();
            }
        }

        spinBtn.addEventListener('click', spin);
        continueBtn.addEventListener('click', handleContinue);
        resetBtn.addEventListener('click', () => { location.reload(); });

        items = initData(); drawWheel(); updateUI();
    </script>
</body>
</html>
